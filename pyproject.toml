[project]
name = "audio2anki"
version = "0.1.0"
description = "Generate Anki decks from audio files or YouTube URLs using Whisper transcription."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Andrew Quinn", email = "andrew.quinn@tutanota.com" }]
dependencies = [
    "click>=8.1",
    "flet[desktop]>=0.84",
    "pydub>=0.25",
    "tqdm>=4.66",
    "genanki>=0.13",
    "python-dotenv>=1.0",
    "librosa>=0.10",
    "numpy>=1.24",
    "yt-dlp>=2024.0",
    "static-ffmpeg>=2.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
whisper = ["openai-whisper"]

[project.scripts]
audio2anki = "audio2anki.cli:main"
audio2anki-gui = "audio2anki.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio2anki"]
